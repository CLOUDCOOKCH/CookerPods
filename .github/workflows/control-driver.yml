name: Build control driver development artifacts
on:
  push:
    branches: [main]
    paths: ['native/CookerPods.Control.Driver/**', '.github/workflows/control-driver.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {persist-credentials: false}
      - name: Enable compiler annotations
        shell: pwsh
        run: Write-Output "::add-matcher::.github/msvc-problem-matcher.json"
      - name: Restore pinned official WDK and SDK
        shell: pwsh
        run: |
          nuget restore native/CookerPods.Control.Driver/packages.config -PackagesDirectory artifacts/wdk-packages -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw 'WDK restore failed' }
      - name: Build ARM64 and x64 profile drivers
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          foreach ($arch in @('ARM64', 'x64')) {
            & $msbuild native/CookerPods.Control.Driver/CookerPodsControl.vcxproj /m:2 /p:Configuration=Release /p:Platform=$arch /verbosity:minimal
            if ($LASTEXITCODE -ne 0) { throw "Driver build failed: $arch" }
          }
      - name: Verify driver architecture and provenance
        shell: python
        run: |
          import hashlib, json, os, struct
          from pathlib import Path
          root = Path('artifacts/driver')
          for arch, expected in [('ARM64', 0xaa64), ('x64', 0x8664)]:
              files = list((root / arch).rglob('CookerPodsControl.sys'))
              assert files, arch
              data = files[0].read_bytes()
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[offset:offset+4] == b'PE\0\0'
              assert struct.unpack_from('<H', data, offset+4)[0] == expected
              print(arch, hashlib.sha256(data).hexdigest())
          (root / 'BUILDINFO.json').write_text(json.dumps({'sourceCommit': os.environ['GITHUB_SHA'], 'signature': 'unsigned development artifacts', 'hardwareValidated': False, 'installableRelease': False}, indent=2))
      - name: Upload development artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CookerPods-control-driver-development
          path: |
            artifacts/driver/**/*.sys
            artifacts/driver/**/*.inf
            artifacts/driver/BUILDINFO.json
          if-no-files-found: error
