name: Build Windows diagnostic preview

on:
  push:
    branches: [main]
    tags: ['v*-native-preview']
    paths:
      - 'native/**'
      - 'scripts/**'
      - 'global.json'
      - 'docs/native-windows.md'
      - '.github/workflows/native.yml'
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Publish the tested packages as the native project version's prerelease
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up pinned .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Test native parser and report behavior
        shell: pwsh
        run: |
          dotnet restore native/CookerPods.Diagnostic.Tests --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore failed' }
          dotnet test native/CookerPods.Diagnostic.Tests -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Native tests failed' }
      - name: Package x64 and ARM64 previews
        run: python scripts/package-native.py
      - name: Smoke-test packaged x64 startup without hardware
        shell: pwsh
        run: |
          & artifacts/native/win-x64/CookerPods-Diagnostic.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged x64 startup failed' }
      - name: Exercise Windows API fallback and bounded report generation
        run: python scripts/smoke-native-windows.py
      - name: Verify PE architectures
        shell: python
        run: |
          from pathlib import Path
          import struct
          for rid, expected in [('win-x64', 0x8664), ('win-arm64', 0xaa64)]:
              data = Path('artifacts/native', rid, 'CookerPods-Diagnostic.exe').read_bytes()
              offset = struct.unpack_from('<I', data, 0x3c)[0]
              assert data[offset:offset+4] == b'PE\0\0'
              assert struct.unpack_from('<H', data, offset + 4)[0] == expected
              print(rid + ' PE architecture verified')
      - name: Upload preview downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CookerPods-native-preview
          path: |
            artifacts/native/*.zip
            artifacts/native/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-preview:
    needs: build-and-package
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_preview)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: native-preview-publication
      cancel-in-progress: false
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download this run's tested packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: CookerPods-native-preview
          path: bundles
      - name: Verify checksums
        working-directory: bundles
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish explicit prerelease
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          import json, os, re, subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile
          version = ET.parse('native/CookerPods.Diagnostic.Windows/CookerPods.Diagnostic.Windows.csproj').findtext('.//Version')
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version)
          tag = 'v' + version + '-native-preview'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag, 'Tag must match the native project Version'
          archives = [Path('bundles', f'CookerPods-Diagnostic-{version}-preview-{rid}.zip') for rid in ['win-x64', 'win-arm64']]
          assert set(Path('bundles').glob('*.zip')) == set(archives)
          for archive in archives:
              with ZipFile(archive) as bundle:
                  info = json.loads(bundle.read('BUILDINFO.json'))
                  assert info['sourceCommit'] == os.environ['GITHUB_SHA']
                  assert info['sourceState'] == 'committed'
                  assert info['version'] == version + '-native-preview'
          subprocess.run(['gh', 'release', 'create', tag, '--target', os.environ['GITHUB_SHA'],
              '--prerelease', '--title', f'Windows diagnostic {version} — native preview',
              '--notes-file', 'native/RELEASE_NOTES.md', *map(str, archives), 'bundles/SHA256SUMS.txt'], check=True)
